<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07100c">
  <title>DeepWorkClock</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section id="setup-screen" class="screen">
      <header class="site-header"><h1>DeepWorkClock</h1></header>
      <form class="setup-form">
        <label class="field-group">
          <p class="field-label"><span>01</span> GOAL</p>
          <input id ="goalInput" type="text" placeholder="Finish Math Homework">
        </label>
        

        <label class="field-group">
          <p class="field-label"><span>02</span> REWARD</p>
          <input id="rewardInput" type="text" placeholder="30 minutes of Gaming">
        </label>
        

        <label class="field-group" for="timeInput">
          <p class="field-label"><span>03</span> TIMER</p>
          <div class="input-with-unit compact-input">
            <input id="timeInput" type="number" placeholder="25">
            <span>MIN</span>
          </div>
        </label>

        <div class="break-config">
          <label class="toggle-label" for="breakToggle">
            <input id="breakToggle" type="checkbox">
            <span class="toggle-box"></span>
            <span>BREAK</span>
          </label>

          <label class="break-duration-control" for="breakInput">
            <span>BREAK TIME</span>
            <div class="input-with-unit compact-input">
              <input id="breakInput" type="number" min="1" placeholder="5">
              <span>MIN</span>
            </div>
          </label>

          <label class="break-duration-control" for="breakAfterInput">
            <span>BREAK AFTER</span>
            <div class="input-with-unit compact-input">
              <input id="breakAfterInput" type="number" min="1" placeholder="25">
              <span>MIN</span>
            </div>
          </label>
        </div>

        <button id="start" class="primary-button">
          START
        </button>

      </form>
    </section>

    <section id="timer-screen" class="screen hidden">
      <header class="site-header"><h1>DeepWorkClock</h1></header>

      <p class="session-label">CURRENT GOAL:</p>
      <p id="CurrGoal" class="field-label"></p>

      <p class="session-label">REWARD:</p>
      <p id="CurrReward" class="field-label"></p>

      <div class="module-heading">
        <span class="session-label">PROGRESS:</span>
        <span id="percentage" class="number-readout">0%</span>
      </div>

      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>

      <div class="module-heading">
        <strong class="session-label">TIME LEFT:</strong>
        <span  id="timeLeft" class="number-readout"></span>
      </div>

      
      <br>

      <div id="breakPercentageModule" class="module-heading hidden">
        <span class="session-label">PROGRESS:</span>
        <span id="breakPercentage" class="number-readout">0%</span>
      </div>
      
      <div class="break-track hidden">
        <div class="break-fill"></div>
      </div>


      <div id="breakModule" class="module-heading hidden">
        <strong class="session-label">BREAK:</strong>
        <span id="breakTime" class="number-readout"></span>
      </div>
    </section>

    

    <section id="complete-screen" class="screen hidden">
      <header class="site-header"><h1>DeepWorkClock</h1></header>
      <h2 class="completion-message">Congratulations!</h2>

      <br>

      <h2 class="session-label">GOAL:</h2>
      <p id="endGoal" class="field-label"></p>

      <br>

      <h2 class="session-label">REWARD UNLOCKED:</h2>
      <p id="endReward" class="field-label"></p>
      
    </section>


      <!-- <footer class="side-footer">Made by Ashraf Mahin</footer> -->
    
  </main>
  <audio id="rewardSound" src="reward sound.mp3"></audio>
  <audio id="alarm" src="Notification Sound.wav"></audio>
  <script src="script.js"></script>



</body>
</html>
